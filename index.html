function move(dir){if(st.tab==='settings'||st.modal)return;let d=st.tab==='weekly'?add(mon(st.d),dir*7):new Date(st.d.getFullYear(),st.d.getMonth()+dir,1);if(d>SCHEDULE_END||(st.tab==='weekly'?add(d,6):new Date(d.getFullYear(),d.getMonth()+1,0))<SCHEDULE_START)return;st.d=clamp(d);st.dir=dir;render(true)}function download(data,type,file){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}function exportCal(){let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NND//Shift Schedule//EN','CALSCALE:GREGORIAN'],stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z'),utc=t=>new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z');for(let d=SCHEDULE_START;d<=SCHEDULE_END;d=add(d,1)){let s=rosterView(d,st.person);if(s!=='D'&&s!=='N')continue;out.push('BEGIN:VEVENT',`UID:${MEMBERS[st.person].id}-${key(d)}@nnd-schedule`,`DTSTAMP:${stamp}`,`DTSTART:${utc(instant(d,s==='D'?7:19))}`,`DTEND:${utc(instant(s==='N'?add(d,1):d,s==='D'?19:7))}`,`SUMMARY:NND ${labels[s]}`,'END:VEVENT')}out.push('END:VCALENDAR');download(out.join('\r\n')+'\r\n','text/calendar','NND-'+MEMBERS[st.person].initials+'.ics')}
let suppress=0;document.addEventListener('click',e=>{if(Date.now()<suppress){e.preventDefault();return}let el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.classList.contains('cover')&&e.target.closest('.sheet'))return;let [act,v]=el.dataset.act.split(':');if(act==='date-open'){st.datePicker=month(st.d);st.yearOpen=false;st.modal='date-picker';showModal();$('.date-trigger')?.setAttribute('aria-expanded','true');return}if(act==='date-years'){st.yearOpen=!st.yearOpen;showModal();return}if(act==='date-month'){let a=st.datePicker,d=new Date(a.getFullYear(),a.getMonth()+Number(v),1);if(dateMonthValid(d)){st.datePicker=d;st.yearOpen=false;showModal()}return}if(act==='date-year'){let a=new Date(Number(v),st.datePicker.getMonth(),1);st.datePicker=month(clamp(a));st.yearOpen=false;showModal();return}if(act==='date-select'||act==='date-today'){let d=act==='date-today'?today():parse(v);if(!inSchedule(d))return;st.d=d;st.modal=null;render();return}if(act==='profile'||act==='pay-unlock'){if(act==='pay-unlock'){if(st.tab!=='settings')return;payPin=''}st.modal=act;showModal();return}if(act.startsWith('pin-')){if(st.modal==='pay-unlock'&&st.tab==='settings')pinAction(act,v);return}if(act==='choose-person'){st.person=Number(v);st.modal=null;render();return}if(act==='pay-shift'){let d=parse(st.modal);if(st.tab!=='my'||!payDate(d)||!['day','night','pto','holiday'].includes(v))return;paySet(d,v,workStatus(v)?12:0);renderPayDay();return}if(act==='pay-reset'){delete payProfile().days[st.modal];let nk=MEMBERS[st.person].id+'|'+st.modal;if(st.notes[nk]?.kind==='PTO'){if(st.notes[nk].text)st.notes[nk].kind='Memo';else delete st.notes[nk]}save();renderPayDay();return}if(act==='pay-period'){st.payDetailKey=v;save();let el=$('#payroll');if(el)el.outerHTML=payOverview(payMonthData());return}if(act==='export'){exportCal();return}if(act==='backup'){download(JSON.stringify({person:st.person,theme:st.theme,view:st.view,notes:st.notes,payroll:st.payroll,summary:st.summary},null,2),'application/json','NND-backup.json');return}if(act==='tab'){st.tab=v;st.modal=null;render(true);window.scrollTo(0,0);return}if(act==='today')st.d=clamp(today());else if(act==='week')st.d=clamp(parse(v));else if(act==='view')st.view=v;else if(act==='filter')st.filter=v==='all'?[]:st.filter.includes(+v)?st.filter.filter(x=>x!==+v):[...st.filter,+v];else if(act==='summary')st.summary=!st.summary;else if(act==='detail'){if(!inSchedule(parse(v)))return;st.modal=v;showModal();return}else if(act==='close'){st.modal=null;render();return}else if(act==='install'){st.modal='install';showModal();return}else if(act==='jumpweek'){st.d=parse(v);st.tab='weekly';st.modal=null}else return;render()});function renderPayDay(){let el=$('#pay-day-editor');if(el)el.outerHTML=payDayEditor(parse(st.modal));let main=$('#content');if(st.tab==='my'&&main)main.innerHTML=scheduleSummary()+calendar(true);tick()}
document.addEventListener('toggle',e=>{if(e.target.isConnected&&e.target.dataset.payDetails){if(e.target.dataset.payDetails==='checks')st.payExpanded=e.target.open;else if(e.target.dataset.payDetails==='daily')st.dailyExpanded=e.target.open;else st.payWeeks=e.target.open;save()}},true);
let payPin='';
function updatePin(error=''){
  let display=$('#pay-pin');if(!display)return;
  display.setAttribute('aria-label',`${payPin.length} of 6 digits entered`);
  display.classList.toggle('invalid',!!error);
  display.querySelectorAll('.pin-dot').forEach((dot,i)=>dot.classList.toggle('filled',i<payPin.length));
  $('#pay-lock-error').textContent=error;
  $('.pay-lock-submit').disabled=payPin.length!==6;
}
function pinAction(act,v){
  if(st.modal!=='pay-unlock'||st.tab!=='settings')return;
  if(act==='pin-digit'&&/^[0-9]$/.test(v)&&payPin.length<6)payPin+=v;
  else if(act==='pin-back')payPin=payPin.slice(0,-1);
  else if(act==='pin-clear')payPin='';
  else if(act==='pin-unlock'){
    if(payPin.length!==6)return;
    if(payPin==='990922'){payPin='';st.modal='pay-settings';showModal();return;}
    payPin='';updatePin('Incorrect passcode. Try again.');return;
  }
  updatePin();
}
document.addEventListener('keydown',e=>{
  if(st.modal!=='pay-unlock'||st.tab!=='settings'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();pinAction('pin-digit',e.key)}
  else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();pinAction('pin-back')}
  else if(e.key==='Enter'){e.preventDefault();pinAction('pin-unlock')}
});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.paySetting){let p=payProfile(),k=t.dataset.paySetting;if(k==='showAmounts')p[k]=t.checked;else if(t.value===''&&k==='rate')p.rate=31.25;else if(t.value!==''&&Number.isFinite(Number(t.value)))p[k]=Math.max(0,Number(t.value));save();return}if(t.dataset.taxRate){if(t.value!==''&&Number.isFinite(Number(t.value))){payProfile().taxRates[t.dataset.taxRate]=Math.min(100,Math.max(0,Number(t.value)))/100;save()}return}if(t.dataset.payTax){payProfile().taxes[t.dataset.payTax]=t.checked;st.payExpanded=true;save();let el=$('#payroll');if(el)el.outerHTML=payOverview(payMonthData());return}let a=e.target.dataset.change,v=e.target.value;if(a==='month'||a==='date'){if(!v)return;st.d=clamp(parse(v))}else if(a==='person')st.person=+v;else if(a==='theme')st.theme=v;else if(a==='view')st.view=v;else if(a==='summary')st.summary=e.target.checked;else return;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.modal){let wasDate=st.modal==='date-picker';st.modal=null;showModal();if(wasDate){$('.date-trigger')?.setAttribute('aria-expanded','false');$('.date-trigger')?.focus()}}else if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('calday')){e.preventDefault();e.target.click()}});
let gesture=null;$('#app').addEventListener('touchstart',e=>{gesture=null;if(e.touches.length!==1||st.modal||st.tab==='settings'||e.target.closest('input,select,textarea,.pay-table-wrap,summary'))return;if(st.tab==='weekly'&&e.target.closest('.scroll')&&$('.scroll').scrollWidth>$('.scroll').clientWidth+2)return;let t=e.touches[0];gesture={x:t.clientX,y:t.clientY,id:t.identifier}},{passive:true});$('#app').addEventListener('touchend',e=>{if(!gesture)return;let g=gesture;gesture=null;let t=Array.from(e.changedTouches).find(t=>t.identifier===g.id);if(!t)return;let dx=t.clientX-g.x,dy=t.clientY-g.y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.5){suppress=Date.now()+350;move(dx<0?1:-1)}},{passive:true});$('#app').addEventListener('touchcancel',()=>gesture=null,{passive:true});window.addEventListener('resize',()=>sizing());setInterval(tick,1000);render();
</script></body></html>

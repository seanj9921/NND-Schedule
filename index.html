<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NND Vision Specialist Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #0d1117;
      }

      button {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        padding: 26px 20px;
      }

      .eyebrow {
        margin: 0 0 3px;
        color: #7d8590;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .header-row,
      .toolbar,
      .legend,
      .filters {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
      }

      .header-row {
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      .legend {
        gap: 10px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #7d8590;
        font-size: 11px;
      }

      .holiday-dot {
        width: 7px;
        height: 7px;
        border-radius: 2px;
      }

      .filters {
        gap: 6px;
        margin-bottom: 16px;
      }

      .filter,
      .nav-button {
        cursor: pointer;
        border: 1px solid #30363d;
        background: transparent;
        color: #7d8590;
      }

      .filter {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 500;
      }

      .filter.all.active {
        border-color: #58a6ff;
        background: #1f3a5f;
        color: #93c5fd;
      }

      .toolbar {
        gap: 10px;
        margin-bottom: 10px;
      }

      .nav-button {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 8px;
        background: #161b22;
        color: #e6edf3;
        font-size: 17px;
      }

      .nav-button:disabled {
        cursor: default;
        background: transparent;
        color: #30363d;
      }

      .week-label {
        font-size: 15px;
        font-weight: 600;
      }

      .table-scroll {
        overflow-x: auto;
        border-radius: 12px;
        -webkit-overflow-scrolling: touch;
      }

      .schedule {
        min-width: 820px;
        overflow: hidden;
        border: 1px solid #21262d;
        border-radius: 12px;
        background: #161b22;
      }

      .grid-row {
        display: grid;
        grid-template-columns: 156px repeat(7, minmax(92px, 1fr));
      }

      .grid-row + .grid-row {
        border-top: 1px solid #21262d;
      }

      .cell {
        min-width: 0;
        padding: 10px 12px;
        border-left: 1px solid #21262d;
      }

      .cell:first-child {
        border-left: 0;
      }

      .weekend {
        background: #0b0f16;
      }

      .outside {
        opacity: 0.2;
      }

      .today {
        background: #0f2744 !important;
      }

      .date-cell.today {
        border-top: 2px solid #58a6ff;
      }

      .holiday-cell {
        background: var(--holiday-bg) !important;
      }

      .holiday-banner .cell {
        padding-block: 5px;
      }

      .section-label {
        color: #4b5563;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .holiday-name {
        overflow: hidden;
        color: var(--holiday-text);
        font-size: 9px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .weekday {
        margin-bottom: 2px;
        color: #6b7280;
        font-size: 10px;
        font-weight: 500;
      }

      .date-number {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
      }

      .today .date-number {
        color: #58a6ff;
      }

      .today-badge {
        padding: 1px 4px;
        border-radius: 3px;
        background: #1e3a5f;
        color: #93c5fd;
        font-size: 8px;
      }

      .month {
        margin-top: 2px;
        color: #4b5563;
        font-size: 9px;
      }

      .member-row {
        transition: opacity 180ms ease;
      }

      .member-row.dimmed {
        opacity: 0.18;
      }

      .member-cell {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .avatar {
        display: inline-grid;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        place-items: center;
        border: 1.5px solid color-mix(in srgb, var(--member) 40%, transparent);
        border-radius: 50%;
        background: color-mix(in srgb, var(--member) 14%, transparent);
        color: var(--member);
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        font-weight: 700;
      }

      .filter .avatar {
        width: 15px;
        height: 15px;
        font-size: 6px;
      }

      .first-name {
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
      }

      .last-name {
        color: #4b5563;
        font-size: 9px;
        line-height: 1.2;
      }

      .shift-cell {
        display: flex;
        min-height: 54px;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }

      .shift {
        display: inline-grid;
        width: 28px;
        height: 20px;
        place-items: center;
        border-radius: 4px;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 700;
      }

      .shift-D {
        border: 1px solid #d97706;
        background: linear-gradient(135deg, #78350f, #92400e);
        color: #fbbf24;
      }

      .shift-N {
        border: 1px solid #3b82f6;
        background: linear-gradient(135deg, #1e3a5f, #1e40af);
        color: #93c5fd;
      }

      .shift-OFF {
        border: 1px solid #21262d;
        color: #4b5563;
      }

      .partners {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .partners-label {
        color: #4b5563;
        font-size: 8px;
      }

      .partners .avatar,
      .pair .avatar {
        width: 15px;
        height: 15px;
        font-size: 6px;
      }

      .pairs-row {
        border-top: 2px solid #21262d !important;
        background: #0b0f16;
      }

      .pair {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-bottom: 3px;
        padding: 3px 5px;
        border: 1px solid color-mix(in srgb, var(--pair) 28%, transparent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--pair) 12%, transparent);
      }

      .pair-label {
        width: 10px;
        color: var(--pair);
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        font-weight: 700;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 9px;
        margin-top: 12px;
        min-width: 700px;
      }

      .stat {
        padding: 9px 10px;
        border: 1px solid #21262d;
        border-top-width: 2px;
        border-radius: 8px;
        background: #161b22;
      }

      .stat-date {
        margin-bottom: 4px;
        color: #4b5563;
        font-size: 9px;
      }

      .counts {
        display: flex;
        gap: 10px;
      }

      .count {
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        font-weight: 700;
      }

      @media (max-width: 700px) {
        .app {
          padding: 14px 10px;
        }

        h1 {
          font-size: 18px;
        }

        .legend {
          gap: 7px;
        }

        .legend .holiday-legend {
          display: none;
        }

        .filters {
          margin-bottom: 10px;
        }

        .filter {
          padding: 4px 8px;
          font-size: 11px;
        }

        .week-label {
          font-size: 13px;
        }

        .grid-row {
          grid-template-columns: 100px repeat(7, 84px);
        }

        .cell {
          padding: 8px 6px;
        }

        .date-number {
          font-size: 15px;
        }

        .member-cell {
          padding-inline: 7px;
        }

        .avatar {
          width: 24px;
          height: 24px;
        }

        .stats {
          gap: 5px;
        }

        .stat {
          padding: 7px 6px;
        }

        .count {
          font-size: 13px;
        }
      }

      @media print {
        .filters,
        .toolbar,
        .legend {
          display: none;
        }

        .app {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <p class="eyebrow">NND Vision Specialist — 2026</p>
      <div class="header-row">
        <h1>Team Schedule</h1>
        <div class="legend" aria-label="Schedule legend">
          <span class="legend-item"><span class="shift shift-D">D</span>Day</span>
          <span class="legend-item"><span class="shift shift-N">N</span>Night</span>
          <span class="legend-item"><span class="shift shift-OFF">OFF</span>Off</span>
          <span class="legend-item holiday-legend"
            ><span class="holiday-dot" style="background: #ef4444"></span>Federal Holiday</span
          >
          <span class="legend-item holiday-legend"
            ><span class="holiday-dot" style="background: #f59e0b"></span>Thanksgiving</span
          >
          <span class="legend-item holiday-legend"
            ><span class="holiday-dot" style="background: #8b5cf6"></span>Shutdown</span
          >
        </div>
      </div>

      <div id="filters" class="filters" aria-label="Member filters"></div>

      <div class="toolbar">
        <button id="prev" class="nav-button" type="button" aria-label="Previous week">‹</button>
        <span id="week-label" class="week-label"></span>
        <button id="next" class="nav-button" type="button" aria-label="Next week">›</button>
      </div>

      <div class="table-scroll">
        <section id="schedule" class="schedule" aria-label="Weekly team schedule"></section>
      </div>

      <div class="table-scroll">
        <section id="stats" class="stats" aria-label="Daily staffing totals"></section>
      </div>
    </main>

    <script>
      const MEMBERS = [
        { id: "daeock", first: "Daeock", last: "Shin", initials: "DS", phase: 2, hue: "#60a5fa" },
        { id: "seungha", first: "Seungha", last: "Lee", initials: "SL", phase: 0, hue: "#a78bfa" },
        { id: "junho", first: "Junho", last: "Park", initials: "JP", phase: 16, hue: "#34d399" },
        { id: "jongmin", first: "Jongmin", last: "Kim", initials: "JK", phase: 12, hue: "#f87171" },
        { id: "sihyun", first: "Sihyun", last: "Joo", initials: "SJ", phase: 4, hue: "#e879f9" },
      ];

      const SCHEDULE_START = new Date(2026, 7, 17);
      const SCHEDULE_END = new Date(2026, 11, 31);
      const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      const HOLIDAYS = {
        "2026-09-07": { label: "Labor Day", short: "Labor", type: "federal" },
        "2026-11-03": { label: "Federal Election", short: "Election", type: "federal" },
        "2026-11-11": { label: "Veterans Day", short: "Veterans", type: "federal" },
        "2026-11-26": { label: "Thanksgiving", short: "Thanks", type: "thanks" },
        "2026-11-27": { label: "Thanksgiving", short: "Thanks", type: "thanks" },
        "2026-12-24": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
        "2026-12-25": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
        "2026-12-26": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
        "2026-12-27": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
        "2026-12-28": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
        "2026-12-29": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
        "2026-12-30": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
        "2026-12-31": { label: "Holiday Shutdown", short: "Shutdown", type: "shutdown" },
      };

      const HOLIDAY_STYLES = {
        federal: { bg: "#1a0808", accent: "#ef4444", text: "#fca5a5" },
        thanks: { bg: "#1a1208", accent: "#f59e0b", text: "#fcd34d" },
        shutdown: { bg: "#0d0a1a", accent: "#8b5cf6", text: "#c4b5fd" },
      };

      const selected = new Set();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      function addDays(date, amount) {
        const result = new Date(date);
        result.setDate(result.getDate() + amount);
        return result;
      }

      function weekMonday(date) {
        const result = new Date(date);
        result.setHours(0, 0, 0, 0);
        const day = result.getDay();
        result.setDate(result.getDate() - (day === 0 ? 6 : day - 1));
        return result;
      }

      function daysBetween(first, second) {
        return Math.round((second.getTime() - first.getTime()) / 86400000);
      }

      function dateKey(date) {
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0"),
        ].join("-");
      }

      function getShift(phase, date) {
        const position = ((phase + daysBetween(SCHEDULE_START, date)) % 24 + 24) % 24;
        if (position <= 3) return "D";
        if (position <= 5) return "OFF";
        if (position <= 9) return "D";
        if (position <= 11) return "OFF";
        if (position <= 15) return "N";
        if (position <= 17) return "OFF";
        if (position <= 21) return "N";
        return "OFF";
      }

      const NAV_MIN = weekMonday(addDays(SCHEDULE_START, -28));
      const NAV_MAX = weekMonday(SCHEDULE_END);
      const currentWeek = weekMonday(today);
      let weekStart =
        currentWeek < NAV_MIN ? new Date(NAV_MIN) : currentWeek > NAV_MAX ? new Date(NAV_MAX) : currentWeek;

      function avatar(member) {
        return `<span class="avatar" style="--member:${member.hue}" title="${member.first} ${member.last}">${member.initials}</span>`;
      }

      function shiftBadge(shift) {
        return `<span class="shift shift-${shift}">${shift}</span>`;
      }

      function holidayVariables(holiday) {
        if (!holiday) return "";
        const style = HOLIDAY_STYLES[holiday.type];
        return `--holiday-bg:${style.bg};--holiday-text:${style.text};--holiday-accent:${style.accent}`;
      }

      function buildWeek() {
        return Array.from({ length: 7 }, (_, index) => {
          const date = addDays(weekStart, index);
          const active = date >= SCHEDULE_START && date <= SCHEDULE_END;
          const shifts = MEMBERS.map((member) => ({
            member,
            shift: active ? getShift(member.phase, date) : "OFF",
          }));
          return {
            date,
            active,
            today: date.getTime() === today.getTime(),
            weekend: index >= 5,
            holiday: active ? HOLIDAYS[dateKey(date)] || null : null,
            shifts,
            dayMembers: shifts.filter((entry) => entry.shift === "D").map((entry) => entry.member),
            nightMembers: shifts.filter((entry) => entry.shift === "N").map((entry) => entry.member),
          };
        });
      }

      function pairMarkup(members, shift) {
        if (!members.length) return "";
        const pairColor = shift === "D" ? "#d97706" : "#3b82f6";
        return `<div class="pair" style="--pair:${pairColor}">
          <span class="pair-label">${shift}</span>
          ${members.map(avatar).join("")}
        </div>`;
      }

      function renderFilters() {
        const filters = document.querySelector("#filters");
        filters.innerHTML = `<button class="filter all ${selected.size ? "" : "active"}" data-member="all" type="button">All</button>
          ${MEMBERS.map((member) => {
            const active = selected.has(member.id);
            const activeStyle = active
              ? `border-color:${member.hue};background:${member.hue}22;color:${member.hue}`
              : "";
            return `<button class="filter" data-member="${member.id}" type="button" style="${activeStyle}">
              ${avatar(member)} ${member.first}
            </button>`;
          }).join("")}`;
      }

      function render() {
        const week = buildWeek();
        const start = week[0].date;
        const end = week[6].date;
        document.querySelector("#week-label").textContent =
          start.getMonth() === end.getMonth()
            ? `${MONTHS[start.getMonth()]} ${start.getDate()}–${end.getDate()}, ${start.getFullYear()}`
            : `${MONTHS[start.getMonth()]} ${start.getDate()} – ${MONTHS[end.getMonth()]} ${end.getDate()}, ${start.getFullYear()}`;

        document.querySelector("#prev").disabled = weekStart <= NAV_MIN;
        document.querySelector("#next").disabled = addDays(weekStart, 7) > NAV_MAX;
        renderFilters();

        const hasHoliday = week.some((day) => day.holiday);
        const holidayBanner = hasHoliday
          ? `<div class="grid-row holiday-banner">
              <div class="cell"><span class="section-label">Holiday</span></div>
              ${week.map((day) => {
                if (!day.holiday) return `<div class="cell"></div>`;
                const style = HOLIDAY_STYLES[day.holiday.type];
                return `<div class="cell holiday-cell" style="${holidayVariables(day.holiday)};border-top:2px solid ${style.accent}">
                  <span class="holiday-name">${day.holiday.label}</span>
                </div>`;
              }).join("")}
            </div>`
          : "";

        const dateHeader = `<div class="grid-row">
          <div class="cell"></div>
          ${week.map((day, index) => `<div class="cell date-cell ${day.today ? "today" : ""} ${day.weekend ? "weekend" : ""} ${day.holiday ? "holiday-cell" : ""} ${day.active ? "" : "outside"}" style="${holidayVariables(day.holiday)}">
            <div class="weekday">${WEEKDAYS[index]}</div>
            <div class="date-number">${day.date.getDate()} ${day.today ? '<span class="today-badge">TODAY</span>' : ""}</div>
            <div class="month">${MONTHS[day.date.getMonth()]}</div>
          </div>`).join("")}
        </div>`;

        const memberRows = MEMBERS.map((member) => {
          const dimmed = selected.size && !selected.has(member.id);
          return `<div class="grid-row member-row ${dimmed ? "dimmed" : ""}">
            <div class="cell member-cell" data-member="${member.id}">
              ${avatar(member)}
              <div><div class="first-name">${member.first}</div><div class="last-name">${member.last}</div></div>
            </div>
            ${week.map((day) => {
              const shift = day.shifts.find((entry) => entry.member.id === member.id).shift;
              const colleagues =
                shift === "D"
                  ? day.dayMembers.filter((person) => person.id !== member.id)
                  : shift === "N"
                    ? day.nightMembers.filter((person) => person.id !== member.id)
                    : [];
              return `<div class="cell shift-cell ${day.today ? "today" : ""} ${day.weekend ? "weekend" : ""} ${day.holiday ? "holiday-cell" : ""} ${day.active ? "" : "outside"}" style="${holidayVariables(day.holiday)}">
                ${day.active ? shiftBadge(shift) : ""}
                ${day.active && shift !== "OFF" && colleagues.length ? `<div class="partners"><span class="partners-label">w/</span>${colleagues.map(avatar).join("")}</div>` : ""}
              </div>`;
            }).join("")}
          </div>`;
        }).join("");

        const pairs = `<div class="grid-row pairs-row">
          <div class="cell"><span class="section-label">Pairs</span></div>
          ${week.map((day) => {
            const showDay = day.active && day.dayMembers.length && (!selected.size || day.dayMembers.some((m) => selected.has(m.id)));
            const showNight = day.active && day.nightMembers.length && (!selected.size || day.nightMembers.some((m) => selected.has(m.id)));
            return `<div class="cell ${day.weekend ? "weekend" : ""} ${day.holiday ? "holiday-cell" : ""}" style="${holidayVariables(day.holiday)}">
              ${showDay ? pairMarkup(day.dayMembers, "D") : ""}
              ${showNight ? pairMarkup(day.nightMembers, "N") : ""}
            </div>`;
          }).join("")}
        </div>`;

        document.querySelector("#schedule").innerHTML = holidayBanner + dateHeader + memberRows + pairs;

        document.querySelector("#stats").innerHTML = week.map((day, index) => {
          const accent = day.holiday ? HOLIDAY_STYLES[day.holiday.type].accent : day.today ? "#58a6ff" : "#21262d";
          return `<div class="stat" style="border-top-color:${accent}">
            <div class="stat-date">${WEEKDAYS[index]} ${day.date.getDate()}</div>
            ${day.active ? `<div class="counts">
              <div><div class="count" style="color:#d97706">${day.dayMembers.length}</div><div class="section-label">D</div></div>
              <div><div class="count" style="color:#3b82f6">${day.nightMembers.length}</div><div class="section-label">N</div></div>
            </div>` : '<span class="section-label">—</span>'}
          </div>`;
        }).join("");
      }

      function toggleMember(memberId) {
        if (memberId === "all") {
          selected.clear();
        } else if (selected.has(memberId)) {
          selected.delete(memberId);
        } else {
          selected.add(memberId);
        }
        render();
      }

      document.addEventListener("click", (event) => {
        const memberControl = event.target.closest("[data-member]");
        if (memberControl) toggleMember(memberControl.dataset.member);
      });

      document.querySelector("#prev").addEventListener("click", () => {
        if (weekStart > NAV_MIN) {
          weekStart = addDays(weekStart, -7);
          render();
        }
      });

      document.querySelector("#next").addEventListener("click", () => {
        if (addDays(weekStart, 7) <= NAV_MAX) {
          weekStart = addDays(weekStart, 7);
          render();
        }
      });

      render();
    </script>
  </body>
</html>

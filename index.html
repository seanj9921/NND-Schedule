function weekly(){let a=mon(st.d),days=Array.from({length:7},(_,i)=>add(a,i));return `${picker()}${weeks()}<div class="range">${fmt(a)} – ${fmt(days[6])}, ${days[6].getFullYear()}</div>${filters()}<div class="scroll"><table class="weektable"><colgroup><col class="namecol">${days.map(()=>'<col class="datecol">').join('')}</colgroup><thead><tr><th class="name muted">CAL</th>${days.map(d=>`<th class="dayhead ${+d===+today()?'today':''}" data-act="detail:${key(d)}"><small>${fmt(d,{weekday:'short'})}</small><strong>${d.getDate()}</strong><small>${fmt(d,{month:'short'})}</small></th>`).join('')}</tr><tr><th class="name muted">Holiday</th>${days.map(d=>`<td class="${isRed(d)?'holiday':''}">${H(d)?esc(H(d).short):'–'}</td>`).join('')}</tr><tr><th class="name muted">PAIRS</th>${days.map(d=>`<td>${pair(d,'D')}${pair(d,'N')}</td>`).join('')}</tr></thead><tbody>${ids().map(i=>`${MEMBERS[i].coater?'<tr class="coaterline"><td class="name">COATER</td><td colspan="7"></td></tr>':''}<tr class="workrow ${MEMBERS[i].coater?'coater':''}"><td class="name">${av(i)}<span class="fullname">${MEMBERS[i].first}<br>${MEMBERS[i].last}</span></td>${days.map(d=>`<td class="${+d===+today()?'today':''}" data-act="detail:${key(d)}">${badge(shift(d,i))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function calendar(personal){let a=month(st.d),first=mon(a),last=new Date(a.getFullYear(),a.getMonth()+1,0),n=Math.ceil((last.getDate()+(a.getDay()+6)%7)/7)*7;return `${picker()}<div class="range">${fmt(a,{month:'long',year:'numeric'})}</div><div class="hint">Swipe to change month · Tap a date for details</div>${personal?stats():filters()}<div class="monthgrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:n},(_,i)=>{let d=add(first,i);if(d.getMonth()!==a.getMonth()||!inSchedule(d))return `<div class="calday blank ${personal?'personalday':''}"></div>`;let groups=['D','N'].map(s=>`<div class="calshift ${s}"><b>${s}</b>${ids().filter(j=>shift(d,j)===s).map(av).join('')||'–'}</div>`).join('');return `<div role="button" tabindex="0" data-act="detail:${key(d)}" class="calday ${personal?'personalday':''} ${isRed(d)?'holiday':''} ${+d===+today()?'today':''}"><div class="num">${d.getDate()}</div>${personal?badge(shift(d,st.person)):groups}${personal&&note(d)?`<div class="noteMark">${esc(note(d).kind)}${note(d).text?' · '+esc(note(d).text):''}</div>`:''}<div class="holidayname">${H(d)?esc(H(d).label.replace('Holiday Shutdown','Shutdown')):''}</div></div>`}).join('')}</div>`}
function personselect(){return `<select aria-label="My profile" data-change="person">${MEMBERS.map((m,i)=>`<option value="${i}" ${i===st.person?'selected':''}>${m.initials} · ${name(m)}</option>`).join('')}</select>`}function find(from,p){for(let d=from;d<=SCHEDULE_END;d=add(d,1))if(inSchedule(d)&&p(d))return d;return null}function scheduleSummary(){let t=today(),i=st.person,s=shift(t,i),next=find(add(t,1),d=>['D','N'].includes(shift(d,i))),off=find(s==='OFF'?t:add(t,1),d=>shift(d,i)==='OFF'),end=off;while(end&&add(end,1)<=SCHEDULE_END&&shift(add(end,1),i)==='OFF')end=add(end,1);let base=s;if(!['D','N'].includes(base)){let prev=add(t,-1);while(prev>=SCHEDULE_START&&!['D','N'].includes(shift(prev,i)))prev=add(prev,-1);base=shift(prev,i);if(!['D','N'].includes(base)&&next)base=shift(next,i)}let rotation=find(add(t,1),d=>['D','N'].includes(shift(d,i))&&shift(d,i)!==base);return `<div class="glass"><div class="row between"><span class="row">${av(i)}<b>${name(MEMBERS[i])}</b></span>${btn(st.summary?'Hide':'Show','summary')}</div>${st.summary?`<div class="summarygrid" style="margin-top:12px"><div class="tile"><small>TODAY · ${fmt(t)}</small><strong style="color:${colors[s]}">${labels[s]}</strong><small>${times[s]}</small></div><div class="tile"><small>NEXT SHIFT</small><strong>${next?fmt(next):'—'}</strong><small>${next?labels[shift(next,i)]+' · '+times[shift(next,i)]:'No data'}</small></div><div class="tile"><small>${s==='OFF'?'Current days off':'Next days off'}</small><strong>${off?fmt(off)+(off<end?' – '+fmt(end):''):'—'}</strong><small>${off?daysBetween(off,end)+1+' consecutive days':''}</small></div><div class="tile"><small>NEXT ROTATION</small><strong>${rotation?fmt(rotation):'—'}</strong><small>${rotation?base+' → '+shift(rotation,i):'No data'}</small></div></div><div id="countdown" style="margin-top:13px"></div>`:''}</div>`}
function tick(){let el=$('#countdown');if(!el)return;let t=today(),now=Date.now(),i=st.person,active=null,next=null;for(let d=add(t,-1);d<=SCHEDULE_END;d=add(d,1)){let s=shift(d,i);if(s!=='D'&&s!=='N')continue;let a=instant(d,s==='D'?7:19),b=instant(s==='N'?add(d,1):d,s==='D'?19:7);if(now>=a&&now<b){active={a,b,s};break}if(a>now){next={a,b,s};break}}let item=active||next;if(!item){el.innerHTML='<small>No upcoming shift in schedule.</small>';return}let ms=(active?item.b:item.a)-now,sec=Math.max(0,Math.floor(ms/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60,p=active?100*(now-item.a)/(item.b-item.a):0;el.innerHTML=`<div class="row between"><small>${active?'ON SHIFT · '+labels[item.s]:'UNTIL NEXT SHIFT'}</small><small>Eastern Time</small></div><div style="font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:4px">${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s</div>${active?`<div class="progress"><span style="width:${p}%"></span></div><div class="row between"><small>Start</small><small>${Math.floor(p)}%</small><small>End</small></div>`:''}`}
function settings(){return `<div class="glass"><h2>Personal settings</h2><div class="setting"><b>My profile</b>${personselect()}</div><div class="setting"><b>Theme</b><select data-change="theme">${['system','light','dark'].map(x=>`<option value="${x}" ${st.theme===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div><div class="setting"><b>Weekly view</b><select data-change="view"><option value="five" ${st.view==='five'?'selected':''}>5 days</option><option value="full" ${st.view==='full'?'selected':''}>Full week</option></select></div><div class="setting"><b>Shift summary</b><input type="checkbox" data-change="summary" ${st.summary?'checked':''}></div><small>${storage?'Settings and personal notes are stored on this device.':'Browser storage unavailable; changes may not persist.'}</small></div><div class="glass"><h2>Calendar tools</h2><div class="setting"><div><b>Export my shifts</b><br><small>Apple / Google Calendar (.ics)</small></div>${btn('Export','export')}</div><div class="setting"><div><b>Add to Home Screen</b><br><small>Safari → Share → Add to Home Screen</small></div>${btn('How to','install')}</div><div class="setting"><div><b>Backup personal settings</b><br><small>Download a local JSON backup</small></div>${btn('Backup','backup')}</div></div><div class="glass"><h2>Schedule updates</h2><small>Release · 2026-11-25</small><p>Interface update: Daeock Kim (DK), Liquid Glass, personal calendar and mobile navigation.</p><p>Official shift calculation and holiday dates unchanged from the previous HTML.</p><small>No verified historical shift-change records are available. Future changes can be documented here; no live push notifications.</small></div>`}
const icons={my:'<circle cx="12" cy="8" r="3.5"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',weekly:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2m4 0h2M8 17h2m4 0h2"/>',monthly:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h1m4 0h1m4 0h1M7 17h1m4 0h1m4 0h1"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/><circle cx="12" cy="12" r="7"/>'};
function sizing(scrollToday=false){let sc=$('.scroll');if(!sc)return;let width=sc.clientWidth,portrait=matchMedia('(orientation:portrait)').matches,n=st.view==='five'&&width<650&&portrait?5:7,nameWidth=width>=650?135:n===5?Math.min(90,Math.max(75,width*.23)):Math.min(76,width*.21),w=(width-nameWidth)/n;sc.style.setProperty('--name-width',nameWidth+'px');$('.namecol').style.width=nameWidth+'px';document.querySelectorAll('.datecol').forEach(c=>c.style.width=w+'px');$('.weektable').style.width=(nameWidth+7*w)+'px';if(scrollToday){let i=daysBetween(mon(st.d),today());sc.scrollLeft=n===5&&i>=5&&i<7?(i-4)*w:0}}
function render(animate=false){theme();let a=$('#app');a.innerHTML=`<div class="row between"><div><div class="eyebrow">NND VISION SPECIALIST · 2026–27</div><h1>${{my:'My Schedule',weekly:'Weekly Schedule',monthly:'Monthly Calendar',settings:'Settings'}[st.tab]}</h1></div>${av(st.person)}</div><div id="content" class="${animate?(st.dir<0?'anim-right':'anim-left'):''}">${st.tab==='weekly'?weekly():st.tab==='monthly'?calendar(false):st.tab==='my'?scheduleSummary()+`<div class="row" style="margin:12px 0">${personselect()}</div>`+calendar(true):settings()}</div>`;$('#tabs').innerHTML=[['my','My Shift'],['weekly','Weekly'],['monthly','Monthly'],['settings','Settings']].map(([x,l])=>btn(`<svg viewBox="0 0 24 24">${icons[x]}</svg>${l}`,'tab:'+x,st.tab===x)).join('');sizing(true);save();tick();showModal()}
function showModal(){let el=$('#modal');if(!st.modal){el.innerHTML='';return}if(st.modal==='install'){el.innerHTML=`<div class="cover" data-act="close"><section class="sheet"><div class="row between"><h2>Add to Home Screen</h2>${btn('Close','close')}</div><p>Open the deployed GitHub Pages website in Safari, tap Share, then Add to Home Screen. Enable Open as Web App if available.</p><small>Offline service worker and native widgets are not included.</small></section></div>`;return}let d=parse(st.modal),n=note(d);el.innerHTML=`<div class="cover" data-act="close"><section class="sheet" role="dialog" aria-modal="true"><div class="row between"><h2>${fmt(d,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2>${btn('✕','close')}</div>${H(d)?`<p style="color:var(--red)">${esc(H(d).label)}</p>`:''}${['D','N','OFF'].map(s=>`<div class="detailgroup"><div class="row between"><b style="color:${colors[s]}">${labels[s]}</b><small>${times[s]}</small></div><div class="row wrap" style="margin-top:8px">${MEMBERS.map((m,i)=>shift(d,i)===s?`<span class="row">${av(i)}${name(m)}${m.coater?' · Coater':''}</span>`:'').join('')||'None'}</div></div>`).join('')}<div class="detailgroup"><b>Personal record · ${name(MEMBERS[st.person])}</b><label for="kind">Type</label><select id="kind">${['Personal','Travel','PTO','Memo'].map(x=>`<option ${n?.kind===x?'selected':''}>${x}</option>`).join('')}</select><label for="memo">Note</label><textarea id="memo" placeholder="Add a note">${esc(n?.text||'')}</textarea><div class="row wrap" style="margin-top:8px">${btn('Save','note-save')}${btn('Delete','note-delete',false,!n)}${btn('View week','jumpweek:'+key(d))}</div><small>Personal records do not change the official shift roster.</small></div></section></div>`}
function move(dir){if(st.tab==='settings'||st.modal)return;let d=st.tab==='weekly'?add(mon(st.d),dir*7):new Date(st.d.getFullYear(),st.d.getMonth()+dir,1);if(d>SCHEDULE_END||(st.tab==='weekly'?add(d,6):new Date(d.getFullYear(),d.getMonth()+1,0))<SCHEDULE_START)return;st.d=clamp(d);st.dir=dir;render(true)}function download(data,type,file){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}function exportCal(){let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NND//Shift Schedule//EN','CALSCALE:GREGORIAN'],stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z'),utc=t=>new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z');for(let d=SCHEDULE_START;d<=SCHEDULE_END;d=add(d,1)){let s=shift(d,st.person);if(s!=='D'&&s!=='N')continue;out.push('BEGIN:VEVENT',`UID:${MEMBERS[st.person].id}-${key(d)}@nnd-schedule`,`DTSTAMP:${stamp}`,`DTSTART:${utc(instant(d,s==='D'?7:19))}`,`DTEND:${utc(instant(s==='N'?add(d,1):d,s==='D'?19:7))}`,`SUMMARY:NND ${labels[s]}`,'END:VEVENT')}out.push('END:VCALENDAR');download(out.join('\r\n')+'\r\n','text/calendar','NND-'+MEMBERS[st.person].initials+'.ics')}
let suppress=0;document.addEventListener('click',e=>{if(Date.now()<suppress){e.preventDefault();return}let el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.classList.contains('cover')&&e.target.closest('.sheet'))return;let [act,v]=el.dataset.act.split(':');if(act==='export'){exportCal();return}if(act==='backup'){download(JSON.stringify({person:st.person,theme:st.theme,view:st.view,notes:st.notes},null,2),'application/json','NND-backup.json');return}if(act==='tab'){st.tab=v;st.modal=null;render(true);window.scrollTo(0,0);return}if(act==='today')st.d=clamp(today());else if(act==='week')st.d=clamp(parse(v));else if(act==='view')st.view=v;else if(act==='filter')st.filter=v==='all'?[]:st.filter.includes(+v)?st.filter.filter(x=>x!==+v):[...st.filter,+v];else if(act==='summary')st.summary=!st.summary;else if(act==='detail'){if(!inSchedule(parse(v)))return;st.modal=v;showModal();return}else if(act==='close'){st.modal=null;showModal();return}else if(act==='install'){st.modal='install';showModal();return}else if(act==='jumpweek'){st.d=parse(v);st.tab='weekly';st.modal=null}else if(act==='note-save'||act==='note-delete'){let k=MEMBERS[st.person].id+'|'+st.modal;if(act==='note-delete')delete st.notes[k];else st.notes[k]={kind:$('#kind').value,text:$('#memo').value.trim()};save();st.modal=null}else return;render()});document.addEventListener('change',e=>{let a=e.target.dataset.change,v=e.target.value;if(a==='month'||a==='date'){if(!v)return;st.d=clamp(parse(v))}else if(a==='person')st.person=+v;else if(a==='theme')st.theme=v;else if(a==='view')st.view=v;else if(a==='summary')st.summary=e.target.checked;else return;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.modal){st.modal=null;showModal()}else if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('calday')){e.preventDefault();e.target.click()}});
let gesture=null;$('#app').addEventListener('touchstart',e=>{gesture=null;if(e.touches.length!==1||st.modal||st.tab==='settings'||e.target.closest('input,select,textarea'))return;if(st.tab==='weekly'&&e.target.closest('.scroll')&&$('.scroll').scrollWidth>$('.scroll').clientWidth+2)return;let t=e.touches[0];gesture={x:t.clientX,y:t.clientY,id:t.identifier}},{passive:true});$('#app').addEventListener('touchend',e=>{if(!gesture)return;let g=gesture;gesture=null;let t=Array.from(e.changedTouches).find(t=>t.identifier===g.id);if(!t)return;let dx=t.clientX-g.x,dy=t.clientY-g.y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.5){suppress=Date.now()+350;move(dx<0?1:-1)}},{passive:true});$('#app').addEventListener('touchcancel',()=>gesture=null,{passive:true});window.addEventListener('resize',()=>sizing());setInterval(tick,1000);render();
</script></body></html>
